name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      # CPU only, tiny fixtures; dataset/slow tests are deselected by pytest addopts
      - run: uv run pytest
