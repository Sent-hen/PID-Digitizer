[project]
name = "pid-digitizer"
version = "0.0.1"
description = "Convert P&ID drawings into graphs (JSON / DEXPI-structured XML)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "networkx>=3.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "pycocotools>=2.0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pid"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["SIM300"]  # yoda rule misfires on capitalized matrix names

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pid"]

[[tool.mypy.overrides]]
module = ["networkx.*", "cv2.*", "pycocotools.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests",
    "dataset: requires the full PID2Graph dataset on disk (not run in CI)",
]
addopts = "-m 'not dataset and not slow'"
